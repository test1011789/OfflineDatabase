name: Build Windows Portable EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl pyinstaller

      - name: Build Portable EXE
        shell: cmd
        run: build_windows.bat

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/OfflineDatabase/OfflineDatabase.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: OfflineDatabase.exe was not created."
          }
          Write-Host "Verified: $exe"

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/OfflineDatabase/*' -DestinationPath 'OfflineDatabase-Windows-Portable.zip' -Force

      - name: Upload EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: OfflineDatabase-Windows-Portable
          path: dist/OfflineDatabase/
          if-no-files-found: error

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: OfflineDatabase-Windows-Portable-ZIP
          path: OfflineDatabase-Windows-Portable.zip
          if-no-files-found: error
